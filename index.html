<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Balance — Gestion commerciale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="auth-screen" class="hidden"></div>

<div id="app" class="hidden">
  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
  <nav class="sidebar" id="sidebar"></nav>
  <div class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:6px;min-width:0;">
        <button class="hamburger-btn" id="hamburger-btn" aria-label="Ouvrir le menu">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="topbar-title" id="topbar-title">Tableau de bord</div>
      </div>
      <div class="topbar-actions">
        <button class="search-trigger" id="search-trigger-btn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <span class="search-trigger-label">Rechercher une action…</span>
          <kbd>Ctrl K</kbd>
        </button>
        <div id="alert-bell"></div>
        <div id="user-badge"></div>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal"></div>
</div>

<div class="cmdk-overlay" id="cmdk-overlay" onclick="if(event.target===this)closePalette()">
  <div class="cmdk">
    <input id="cmdk-input" placeholder="Nouvelle facture, nouveau client, aller au stock…" autocomplete="off">
    <div class="cmdk-list" id="cmdk-list"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
